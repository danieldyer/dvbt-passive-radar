<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DVB-T · Passive radar</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d131e;color:#d5e3f0;font:16px system-ui}canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;top:45%;width:100%;text-align:center;letter-spacing:.1em}
</style></head><body><div id="loading">Loading radar viewer…</div><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
var Module={canvas:document.getElementById('canvas'),onRuntimeInitialized(){document.getElementById('loading').remove();poll();}};
window.radar={playing:true,refresh:false,remove_dc:false,rmin:0,rmax:30000,fmin:-100,fmax:100,width:1100,height:750,frames:0,status:'Waiting for a map'};
async function poll(){
 const r=window.radar;
 if(r.playing||r.refresh){r.refresh=false;try{
  const q=new URLSearchParams({rmin:r.rmin,rmax:r.rmax,fmin:r.fmin,fmax:r.fmax,width:r.width,height:r.height,remove_dc:r.remove_dc?1:0});
  const response=await fetch('/api/frame?'+q,{cache:'no-store'});
  if(response.status===200){
   const buffer=await response.arrayBuffer(),v=new DataView(buffer);
   if(v.getUint32(0,true)!==0x314d4452)throw Error('Invalid frame');
   const n=v.getUint32(4,true),meta=JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,16,n)));
   const data=new Uint8Array(buffer,16+n),ptr=Module._malloc(data.byteLength);
   Module.HEAPU8.set(data,ptr);window.radar.meta=meta;
   Module._receive_frame(ptr,meta.ranges,meta.frequencies,meta.range_start_m,meta.range_step_m,meta.frequency_start_hz,meta.frequency_step_hz,meta.integration_s,meta.native_frequency_step_hz,meta.coherence,meta.time_end_s,meta.sequence);
   Module._free(ptr);r.frames++;r.status='Live';
  }else if(response.status===204){r.status='Waiting for reconstruction';}else throw Error(await response.text());
 }catch(e){r.status=e.message;}}
 setTimeout(poll,350);
}
window.requestIntegration=async function(seconds){
 const result=await fetch('/api/integration',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seconds})});
 if(!result.ok)window.radar.status=await result.text();
};
</script>{{{ SCRIPT }}}</body></html>
